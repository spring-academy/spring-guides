apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: spring-academy-guides-upgrading-boot-jdk-8-to-17
spec:
  title: "Upgrading the JDK Version of a Spring Boot Application from 8 to 17"
  description: "Upgrading the JDK Version of a Spring Boot Application from 8 to 17"
  workshop:
    image: jdk8-environment:*
    files:
      - http:
          # the name of the tar.gz here should make the workshop name
          url: "$(ingress_protocol)://$(assets_repository)/spring-academy-guides-upgrading-boot-jdk-8-to-17.tar.gz"
      - path: .local/share/code-server
        image:
          url: ghcr.io/spring-academy/vscode-java-tools-$(platform_arch)-files:0.25.14
      - path: exercises
        git:
          url: https://github.com/spring-academy/course-spring-boot-2-5-to-2-7-upgrade-code
          ref: main
        newRootPath: .
  request:
    parameters:
    - name: USER_DOMAIN
      value: "unknown.domain"
    - name: USER_EMAIL
      value: "somebody@unknown.domain"
  session:
    env:
      - name: LESSON_LABEL
        value: java-upgrade-start
    namespaces:
      budget: medium
    resources:
      memory: 2Gi
    applications:
      terminal:
        enabled: true
      editor:
        enabled: true
    dashboards:
      - name: Editor
      - name: Terminal
  environment:
    assets:
      memory: 0Mi
      ingress:
        enabled: true
      files:
        - image:
            url: ghcr.io/spring-academy/spring-guides:${VERSION}
          newRootPath: usr/share/nginx/html