apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: spring-academy-guides-upgrade-from-spring-boot-2x-to-3x
spec:
  title: "Closing the Gap: Upgrading your App from Spring Boot 2.x to 3.x"
  description: "Closing the Gap: Upgrading your App from Spring Boot 2.x to 3.x"
  workshop:
    image: jdk8-environment:*
    files:
      - http:
          # the name of the tar.gz here should make the workshop name
          url: "$(ingress_protocol)://$(assets_repository)/spring-academy-guides-upgrade-from-spring-boot-2x-to-3x.tar.gz"
      - path: .local/share/code-server
        image:
          url: ghcr.io/spring-academy/vscode-java-tools-$(platform_arch)-files:0.25.14
      - path: exercises
        git:
          url: https://github.com/spring-academy/course-spring-boot-2-5-upgrade-code
          ref: ilw
        newRootPath: .
  request:
    parameters:
    - name: USER_DOMAIN
      value: "unknown.domain"
    - name: USER_EMAIL
      value: "somebody@unknown.domain"
  session:
    env:
      - name: LESSON_LABEL
        value: 01-ilw-start-01
      - name: WEBSERVER
        value: "$(ingress_protocol)://$(assets_repository)"
    namespaces:
      budget: medium
    resources:
      memory: 2Gi
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
  environment:
    assets:
      memory: 0Mi
      ingress:
        enabled: true
      files:
        - image:
            url: ghcr.io/spring-academy/spring-guides:${VERSION}
          newRootPath: usr/share/nginx/html